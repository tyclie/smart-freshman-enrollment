<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室 - 智慧迎新</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f7fa; }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 1000; flex-wrap: wrap;
        }
        .navbar .logo { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg,#1a73e8,#00c9a7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .navbar .nav-links { display: flex; gap: 6px; list-style: none; flex-wrap: wrap; }
        .navbar .nav-links a { color: #333; font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; text-decoration: none; transition: all 0.3s; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background: #e8f0fe; color: #1a73e8; font-weight: 500; }
        .chat-container {
            max-width: 800px; margin: 80px auto 20px; padding: 0 20px;
            display: flex; flex-direction: column; height: calc(100vh - 140px);
        }
        .chat-messages {
            flex: 1; overflow-y: auto; background: white; border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 12px;
        }
        .message {
            max-width: 70%; padding: 10px 14px; border-radius: 14px;
            margin-bottom: 12px; word-wrap: break-word; position: relative;
        }
        .message .sender { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        .message .content { font-size: 0.9rem; }
        .message .time { font-size: 0.7rem; color: #aaa; margin-top: 4px; }
        .message-own {
            background: linear-gradient(135deg, #1a73e8, #4a90e2); color: white;
            margin-left: auto; border-bottom-right-radius: 4px;
        }
        .message-own .sender, .message-own .time { color: rgba(255,255,255,0.8); }
        .message-other {
            background: #f0f0f0; color: #333;
            margin-right: auto; border-bottom-left-radius: 4px;
        }
        .message-admin {
            background: #fff3e0; color: #e65100;
            margin-right: auto; border-bottom-left-radius: 4px;
        }
        .message-counselor {
            background: #e8f5e9; color: #2e7d32;
            margin-right: auto; border-bottom-left-radius: 4px;
        }
        .chat-input { display: flex; gap: 10px; }
        .chat-input input {
            flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 25px;
            font-size: 0.95rem; transition: all 0.3s;
        }
        .chat-input input:focus { outline: none; border-color: #1a73e8; }
        .btn { padding: 12px 24px; border: none; border-radius: 25px; cursor: pointer; font-size: 0.95rem; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg,#1a73e8,#4a90e2); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
        .role-tag { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 0.7rem; margin-left: 4px; }
        .role-student { background: #e3f2fd; color: #1565c0; }
        .role-admin { background: #fff3e0; color: #e65100; }
        .role-counselor { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    {% set active_page = 'chat' %}
    {% include '_navbar.html' %}

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="输入消息，与同学、辅导员、管理员交流...">
            <button class="btn btn-primary" id="sendBtn">发送</button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        const username = "{{ current_user.username }}";
        const role = "{{ current_user.role }}";
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        const roleNames = { 'student': '学生', 'admin': '管理员', 'counselor': '辅导员' };
        const roleClasses = { 'student': 'role-student', 'admin': 'role-admin', 'counselor': 'role-counselor' };

        function formatTime(timestamp) {
            if (!timestamp) return '';
            return timestamp.replace('T', ' ').substring(0, 16);
        }

        function renderMessages(messages) {
            chatMessages.innerHTML = '';
            if (messages.length === 0) {
                chatMessages.innerHTML = '<p style="color:#999;text-align:center;">暂无消息，来发第一条吧！</p>';
                return;
            }
            messages.forEach(msg => {
                const div = document.createElement('div');
                const isOwn = (msg.sender_username === username);
                let roleTagClass = roleClasses[msg.sender_role] || '';
                div.className = 'message ';
                if (isOwn) {
                    div.className += 'message-own';
                } else if (msg.sender_role === 'admin') {
                    div.className += 'message-admin';
                } else if (msg.sender_role === 'counselor') {
                    div.className += 'message-counselor';
                } else {
                    div.className += 'message-other';
                }
                div.innerHTML = `
                    <div class="sender">
                        ${msg.sender_username}
                        <span class="role-tag ${roleTagClass}">${roleNames[msg.sender_role] || msg.sender_role}</span>
                    </div>
                    <div class="content">${App.escapeHtml(msg.content)}</div>
                    <div class="time">${formatTime(msg.timestamp)}</div>
                `;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function loadMessages() {
            try {
                const res = await fetch('/api/chat/messages');
                const data = await res.json();
                if (data.success) renderMessages(data.messages);
            } catch (err) {
                console.error('加载消息失败', err);
            }
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content) return;
            try {
                const res = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (data.success) {
                    messageInput.value = '';
                    await loadMessages();
                } else {
                    App.toast('发送失败：' + (data.message || '未知错误'), 'error');
                }
            } catch (err) {
                App.toast('网络错误', 'error');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 初始加载
        loadMessages();
        // 每5秒刷新一次
        setInterval(loadMessages, 5000);
    </script>
</body>
</html>
