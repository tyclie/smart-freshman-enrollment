<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能填报 - 智慧迎新</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f7fa; }
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; z-index: 1000; flex-wrap: wrap;
        }
        .navbar .logo { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg,#1a73e8,#00c9a7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .navbar .nav-links { display: flex; gap: 6px; list-style: none; flex-wrap: wrap; }
        .navbar .nav-links a { color: #333; font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; text-decoration: none; transition: all 0.3s; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background: #e8f0fe; color: #1a73e8; font-weight: 500; }
        .container { max-width: 1100px; margin: 80px auto 40px; padding: 0 20px; }
        .page-title { font-size: 1.5rem; font-weight: 700; color: #1a73e8; margin-bottom: 20px; }
        .upload-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #1a73e8; margin-bottom: 16px; }
        .upload-area {
            border: 2px dashed #ccc; border-radius: 14px; padding: 20px; text-align: center;
            cursor: pointer; transition: all 0.3s; min-height: 220px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .upload-area:hover, .upload-area.dragover { border-color: #1a73e8; background: #e8f0fe; }
        .upload-area img { max-width: 100%; max-height: 200px; border-radius: 10px; margin-bottom: 10px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 0.9rem; transition: all 0.3s; background: #fafafa;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #1a73e8; background: white; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 25px; font-size: 0.9rem; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg,#1a73e8,#4a90e2); color: white; box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
        .btn-success { background: linear-gradient(135deg,#34a853,#66bb6a); color: white; box-shadow: 0 4px 12px rgba(52,168,83,0.3); }
        .btn:hover { transform: translateY(-2px); }
        .loading-overlay { display: none; text-align: center; padding: 15px; }
        .loading { display: inline-block; width: 22px; height: 22px; border: 3px solid #ccc; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) { .upload-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    {% set active_page = 'ocr_upload' %}
    {% include '_navbar.html' %}

    <div class="container">
        <h2 class="page-title">📝 智能信息填报</h2>
        <div class="upload-container">
            <!-- 左侧：上传区域 -->
            <div class="card">
                <div class="card-title">上传身份证/录取通知书</div>
                <div class="upload-area" id="uploadArea">
                    <div id="uploadPlaceholder">
                        <div style="font-size:3rem;">📷</div>
                        <p>点击上传或拖拽图片到此处</p>
                        <p style="color:#999;font-size:0.8rem;">支持 JPG、PNG</p>
                    </div>
                    <img id="previewImage" style="display:none;" alt="预览">
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
                </div>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading"></div>
                    <p style="margin-top:8px;">正在智能识别中...</p>
                </div>
                <button class="btn btn-primary" id="ocrBtn" disabled style="width:100%;margin-top:12px;">🔍 智能识别</button>
            </div>

            <!-- 右侧：表单 -->
            <div class="card">
                <div class="card-title">识别结果（可修改）</div>
                <form id="reportForm">
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="name" name="name" placeholder="自动填充">
                    </div>
                    <div class="form-group">
                        <label>身份证号</label>
                        <input type="text" id="id_card" name="id_card" placeholder="自动填充">
                    </div>
                    <div class="form-group">
                        <label>性别</label>
                        <select id="gender" name="gender">
                            <option value="">请选择</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>班级</label>
                        <input type="text" id="class_name" name="class_name" placeholder="如：软件工程1班">
                    </div>
                    <div class="form-group">
                        <label>专业</label>
                        <input type="text" id="major" name="major" placeholder="自动填充">
                    </div>
                    <div class="form-group">
                        <label>学号</label>
                        <input type="text" id="student_id" name="student_id" value="{{ current_user.username }}" placeholder="自动填充，可修改">

                    </div>
                    <div class="form-group">
                        <label>联系电话</label>
                        <input type="text" id="contact" name="contact" placeholder="自动填充">
                    </div>
                    <button type="submit" class="btn btn-success" id="saveBtn" style="width:100%;">💾 保存信息</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const ocrBtn = document.getElementById('ocrBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const saveBtn = document.getElementById('saveBtn');

        // 当前登录学号已由服务端直接填入，无需额外请求。

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) handleFile({ target: { files: e.dataTransfer.files } });
        });

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file || !file.type.startsWith('image/')) { alert('请上传图片文件'); return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
                ocrBtn.disabled = false;
            };
            reader.readAsDataURL(file);
            window.selectedFile = file;
        }

        ocrBtn.addEventListener('click', async () => {
            if (!window.selectedFile) { alert('请先上传图片'); return; }
            loadingOverlay.style.display = 'block';
            ocrBtn.disabled = true;
            const formData = new FormData();
            formData.append('file', window.selectedFile);
            try {
                const res = await fetch('/api/ocr', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success && data.data) {
                    document.getElementById('name').value = data.data.name || '';
                    document.getElementById('id_card').value = data.data.id_card || '';
                    document.getElementById('gender').value = data.data.gender || '';
                    document.getElementById('class_name').value = data.data.class_name || '';
                    document.getElementById('major').value = data.data.major || '';
                    document.getElementById('student_id').value = data.data.student_id || '';
                    document.getElementById('contact').value = data.data.contact || '';
                    App.toast('识别成功，请核对修改后保存', 'success');
                } else {
                    App.toast('识别失败：' + (data.message || '未知错误'), 'error');
                }
            } catch (err) {
                App.toast('网络错误，请稍后重试', 'error');
            } finally {
                loadingOverlay.style.display = 'none';
                ocrBtn.disabled = false;
            }
        });

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            const data = {
                name: document.getElementById('name').value.trim(),
                id_card: document.getElementById('id_card').value.trim(),
                gender: document.getElementById('gender').value,
                class_name: document.getElementById('class_name').value.trim(),
                major: document.getElementById('major').value.trim(),
                student_id: document.getElementById('student_id').value.trim(),
                contact: document.getElementById('contact').value.trim()
            };
            try {
                const res = await fetch('/api/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    App.toast('保存成功，当前流程进入资格审核阶段', 'success');
                    setTimeout(() => location.href = '/register_flow', 1000);
                } else {
                    App.toast('保存失败：' + (result.message || '未知错误'), 'error');
                }
            } catch (err) {
                App.toast('网络错误，请稍后重试', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 保存信息';
            }
        });
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
